<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nasrin &amp; Omar</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,400&amp;family=Caveat:wght@400;700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --rose: #e8a0b4;
      --blush: #f5d5e0;
      --midnight: #1a0f2e;
      --lavender: #c4b5e3;
      --gold: #d4a574;
      --cream: #faf5ef;
    }
    body { font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
    .font-display { font-family: 'Fraunces', serif; }
    .font-hand { font-family: 'Caveat', cursive; }
    @media (max-width: 768px) {
      html { font-size: 15px; }
    }
    @media (max-width: 640px) {
      html { font-size: 14px; }
    }
    @media (max-width: 480px) {
      html { font-size: 13px; }
    }
    @media (max-width: 375px) {
      html { font-size: 12px; }
    }

    #cursor-glow {
      position: fixed; width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(232,160,180,0.12) 0%, rgba(196,181,227,0.08) 30%, transparent 70%);
      pointer-events: none; z-index: 9999; transform: translate(-50%,-50%);
      transition: left 0.15s ease-out, top 0.15s ease-out;
    }

    /* Bokeh overlay */
    .bokeh-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
    .bokeh-dot {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, rgba(232,160,180,0.25) 0%, transparent 70%);
      animation: bokehFloat 12s ease-in-out infinite;
    }
    @keyframes bokehFloat {
      0%,100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-30px) scale(1.2); opacity: 0.6; }
    }

    @keyframes petalFall {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg) scale(1); opacity: 0.7; }
      25% { transform: translateY(25vh) translateX(40px) rotate(90deg) scale(0.9); opacity: 0.6; }
      50% { transform: translateY(50vh) translateX(-20px) rotate(180deg) scale(0.8); opacity: 0.5; }
      75% { transform: translateY(75vh) translateX(30px) rotate(270deg) scale(0.6); opacity: 0.3; }
      100% { transform: translateY(110vh) translateX(-10px) rotate(360deg) scale(0.4); opacity: 0; }
    }
    .petal { position: fixed; pointer-events: none; z-index: 1; animation: petalFall linear infinite; }

    @keyframes letterReveal {
      0% { opacity: 0; transform: translateY(50px) rotateX(-90deg) scale(0.5); filter: blur(10px); }
      60% { opacity: 1; transform: translateY(-5px) rotateX(5deg) scale(1.05); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); filter: blur(0); }
    }
    .letter-char { display: inline-block; opacity: 0; animation: letterReveal 0.8s cubic-bezier(0.22,1,0.36,1) forwards; }

    .shimmer {
      background: linear-gradient(90deg, var(--midnight) 0%, var(--rose) 15%, var(--gold) 30%, var(--lavender) 50%, var(--gold) 70%, var(--rose) 85%, var(--midnight) 100%);
      background-size: 400% 100%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shimmer 6s ease-in-out infinite;
    }
    @keyframes shimmer { 0% { background-position: 400% 0; } 100% { background-position: -400% 0; } }

    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(28px); border: 1px solid rgba(255,255,255,0.12); }
    .glass-light { background: rgba(255,255,255,0.65); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 8px 40px rgba(232,160,180,0.1); }

    .gradient-border { position: relative; overflow: visible; }
    .gradient-border::before {
      content: ''; position: absolute; inset: -2px; border-radius: inherit; padding: 2px;
      background: linear-gradient(var(--gradient-angle, 0deg), var(--rose), var(--lavender), var(--gold), var(--rose));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: rotateGradient 4s linear infinite;
    }
    @keyframes rotateGradient { to { --gradient-angle: 360deg; } }
    @property --gradient-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

    @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 33% { transform: translateY(-16px) rotate(3deg); } 66% { transform: translateY(-8px) rotate(-2deg); } }
    @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 20px rgba(232,160,180,0.3), 0 0 60px rgba(196,181,227,0.1); } 50% { box-shadow: 0 0 60px rgba(232,160,180,0.6), 0 0 120px rgba(196,181,227,0.3); } }
    @keyframes heartbeat { 0%,100% { transform: scale(1); } 14% { transform: scale(1.3); } 28% { transform: scale(1); } 42% { transform: scale(1.2); } 56% { transform: scale(1); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(60px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes envelopeOpen { 0% { transform: perspective(800px) rotateX(5deg) scale(0.9); opacity: 0; } 100% { transform: perspective(800px) rotateX(0deg) scale(1); opacity: 1; } }
    @keyframes ribbonReveal { from { width: 0; } to { width: 80px; } }
    @keyframes glowPulse { 0%,100% { box-shadow: 0 0 8px var(--rose), 0 0 20px rgba(232,160,180,0.3); } 50% { box-shadow: 0 0 20px var(--rose), 0 0 50px rgba(232,160,180,0.5); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity:0; transform: scale(0.8); } to { opacity:1; transform: scale(1); } }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.08); opacity: 1; } }

    /* Animated underline for section titles */
    .animated-underline { position: relative; display: inline-block; }
    .animated-underline::after {
      content: ''; position: absolute; bottom: -6px; left: 0; width: 0; height: 3px;
      background: linear-gradient(90deg, var(--rose), var(--gold), var(--lavender));
      border-radius: 2px; transition: width 1s cubic-bezier(0.22,1,0.36,1);
    }
    .animated-underline.visible::after { width: 100%; }

    .reveal { opacity: 0; }
    .reveal.visible { animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) forwards; }
    .reveal-left.visible { animation: slideInLeft 1s cubic-bezier(0.22,1,0.36,1) forwards; }
    .reveal-right.visible { animation: slideInRight 1s cubic-bezier(0.22,1,0.36,1) forwards; }
    .reveal-envelope.visible { animation: envelopeOpen 1.2s cubic-bezier(0.22,1,0.36,1) forwards; }
    .reveal-scale.visible { animation: scaleIn 0.8s cubic-bezier(0.22,1,0.36,1) forwards; }

    .heart-float { position: absolute; animation: float 6s ease-in-out infinite; opacity: 0.3; }
    .card-hover { transition: transform 0.6s cubic-bezier(0.22,1,0.36,1), box-shadow 0.6s ease; }
    .card-hover:hover { transform: translateY(-12px) scale(1.02); box-shadow: 0 35px 70px rgba(232,160,180,0.3); }
    @media (max-width: 640px) {
      .card-hover:hover { transform: translateY(-6px) scale(1.01); }
      .glass-light { padding: 1rem; }
    }
    .glow-btn { animation: pulse-glow 3s ease-in-out infinite; }
    .heartbeat { animation: heartbeat 2s ease-in-out infinite; }

    .hero-mesh {
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background:
        radial-gradient(ellipse at 10% 20%, rgba(232,160,180,0.6) 0%, transparent 40%),
        radial-gradient(ellipse at 90% 80%, rgba(196,181,227,0.6) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%, rgba(212,165,116,0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 30% 70%, rgba(245,213,224,0.4) 0%, transparent 35%),
        linear-gradient(160deg, #faf5ef 0%, #f5d5e0 30%, #c4b5e3 65%, #faf5ef 100%);
    }

    .divider-wave { height: 3px; background: linear-gradient(90deg, transparent, var(--rose), var(--gold), var(--rose), transparent); margin: 1.5rem auto; border-radius: 2px; }
    .divider-wave.visible { animation: ribbonReveal 1s ease-out forwards; width: 0; }

    .tilt-card { transition: transform 0.3s ease, box-shadow 0.3s ease; transform-style: preserve-3d; will-change: transform; }

    #starfield { position: absolute; inset: 0; z-index: 0; }

    .img-reveal { clip-path: inset(100% 0 0 0); transition: clip-path 1.2s cubic-bezier(0.22,1,0.36,1); }
    .img-reveal.visible { clip-path: inset(0 0 0 0); }

    .glow-ring { position: relative; }
    .glow-ring::before { content: ''; position: absolute; inset: -4px; border-radius: inherit; background: linear-gradient(135deg, var(--rose), var(--lavender), var(--gold)); z-index: -1; opacity: 0.6; filter: blur(10px); animation: pulse-glow 4s ease-in-out infinite; }

    .parallax-strip { position: relative; overflow: hidden; }
    .parallax-img-wrapper { position: absolute; inset: -30% 0; }

    .timeline-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--rose); animation: glowPulse 3s ease-in-out infinite; }
    .timeline-line { width: 2px; background: linear-gradient(180deg, var(--rose), var(--lavender), var(--gold)); }

    .quote-fade { animation: fadeIn 0.6s ease forwards; }
    .counter-num { font-variant-numeric: tabular-nums; }

    @keyframes countPop { 0% { transform: scale(1.4) rotateX(20deg); opacity:0.4; } 100% { transform: scale(1) rotateX(0); opacity:1; } }
    .count-pop { animation: countPop 0.5s cubic-bezier(0.22,1,0.36,1); }

    @media (max-width: 768px) {
      .hero-mesh { min-height: auto; padding: 2rem 1rem; }
      .parallax-strip { height: calc(50 * min(var(--vh,1vh),1vh)) !important; }
      .tilt-card { transition: none; }
      .tilt-card:hover { transform: none; box-shadow: none; }
      .grid { gap: 1.5rem !important; }
      .glass-light { padding: 1rem !important; }
      section { padding-top: 1.5rem !important; padding-bottom: 1.5rem !important; }
      h1 { font-size: 2.5rem !important; line-height: 1.1; }
      h2 { font-size: 1.75rem !important; }
      p { font-size: 0.95rem !important; line-height: 1.5; }
    }
    @media (max-width: 640px) {
      .hero-mesh { padding: 1.5rem 0.75rem; }
      .parallax-strip { height: calc(45 * min(var(--vh,1vh),1vh)) !important; }
      h1 { font-size: 2rem !important; }
      h2 { font-size: 1.5rem !important; }
      p { font-size: 0.9rem !important; }
      section { padding: 1.25rem !important; }
      .glass-light { padding: 0.875rem !important; }
      .px-6 { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
      .max-w-4xl, .max-w-3xl, .max-w-6xl { max-width: 100% !important; }
      .grid { gap: 1rem !important; }
      .card-hover { gap: 0.5rem !important; }
    }
    @media (max-width: 480px) {
      .hero-mesh { padding: 1rem 0.5rem; min-height: auto; }
      .parallax-strip { height: calc(40 * min(var(--vh,1vh),1vh)) !important; }
      h1 { font-size: 1.5rem !important; line-height: 1; }
      h2 { font-size: 1.25rem !important; }
      p { font-size: 0.85rem !important; line-height: 1.4; }
      section { padding: 1rem !important; }
      .glass-light { padding: 0.75rem !important; }
      .px-6 { padding-left: 0.5rem !important; padding-right: 0.5rem !important; }
      .max-w-4xl, .max-w-3xl, .max-w-6xl { max-width: 100% !important; }
      .grid { gap: 0.75rem !important; }
      .glass { padding: 0.75rem !important; }
    }
    @media (max-width: 375px) {
      h1 { font-size: 1.25rem !important; }
      h2 { font-size: 1.1rem !important; }
      p { font-size: 0.8rem !important; }
      section { padding: 0.75rem !important; }
      .glass-light { padding: 0.6rem !important; }
    }

    #scroll-progress { position: fixed; top:0; left:0; height:3px; z-index:10000; background: linear-gradient(90deg, var(--rose), var(--lavender), var(--gold), var(--rose)); background-size: 200% 100%; animation: shimmer 3s linear infinite; transition: width 0.1s linear; }

    #love-meter { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); z-index: 9998; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    @media (max-width: 640px) {
      #love-meter { display: none; }
    }
    #love-meter-bar { width: 6px; height: 120px; border-radius: 3px; background: rgba(232,160,180,0.2); overflow: hidden; position: relative; }
    #love-meter-fill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, var(--rose), var(--lavender), var(--gold)); border-radius: 3px; transition: height 0.3s ease; }
    #love-meter-heart { font-size: 1.2rem; animation: breathe 2s ease-in-out infinite; }

    .magnetic-btn { transition: transform 0.2s ease-out; }

    .section-fade { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .section-fade.in-view { opacity: 1; transform: translateY(0); }

    /* Tap burst hearts */
    @keyframes burstHeart {
      0% { transform: translate(-50%,-50%) scale(0); opacity: 1; }
      50% { opacity: 1; }
      100% { transform: translate(-50%,-50%) translateY(-80px) scale(1.5); opacity: 0; }
    }
    .burst-heart {
      position: fixed; pointer-events: none; z-index: 9997;
      font-size: 1.5rem; animation: burstHeart 1s ease-out forwards;
    }

    /* Audio visualizer ring */
    @keyframes vizPulse {
      0%,100% { transform: scale(1); box-shadow: 0 0 20px rgba(232,160,180,0.3); }
      50% { transform: scale(1.1); box-shadow: 0 0 50px rgba(232,160,180,0.7), 0 0 80px rgba(196,181,227,0.4); }
    }
    .viz-active { animation: vizPulse 0.6s ease-in-out infinite; }

    /* Secret message */
    @keyframes secretReveal {
      from { opacity: 0; transform: translateY(20px) scale(0.8); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .secret-msg { animation: secretReveal 0.8s ease forwards; }
  </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 </head>
 <body data-template-id="__page-root" class="w-full">
  <div id="scroll-progress" style="width:0%"></div>
  <div id="cursor-glow"></div>
  <div id="petals" class="fixed inset-0 pointer-events-none z-[1]" aria-hidden="true"></div><!-- Bokeh Overlay -->
  <div class="bokeh-overlay" id="bokeh-overlay" aria-hidden="true"></div><!-- Love Meter -->
  <div id="love-meter" aria-hidden="true"><span id="love-meter-heart">💗</span>
   <div id="love-meter-bar">
    <div id="love-meter-fill" style="height:0%"></div>
   </div>
  </div><!-- HERO -->
  <section class="hero-mesh relative flex items-center justify-center overflow-hidden section-fade in-view" id="hero">
   <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true"><span class="heart-float" style="top:5%;left:10%;animation-delay:0s;font-size:1.6rem">💕</span> <span class="heart-float" style="top:15%;left:75%;animation-delay:1s;font-size:1.1rem">✨</span> <span class="heart-float" style="top:50%;left:5%;animation-delay:2s;font-size:1.3rem">🤍</span> <span class="heart-float" style="top:70%;left:85%;animation-delay:0.6s;font-size:1.1rem">💫</span> <span class="heart-float" style="top:35%;left:60%;animation-delay:1.5s;font-size:1.4rem">🌸</span> <span class="heart-float" style="top:85%;left:30%;animation-delay:2.8s;font-size:1rem">💕</span> <span class="heart-float" style="top:25%;left:35%;animation-delay:3.5s;font-size:0.9rem">🦋</span> <span class="heart-float" style="top:60%;left:45%;animation-delay:4s;font-size:1.2rem">🌙</span> <span class="heart-float" style="top:42%;left:90%;animation-delay:2.2s;font-size:1rem">🩷</span> <span class="heart-float" style="top:78%;left:55%;animation-delay:3.2s;font-size:1.3rem">🪷</span>
   </div>
   <div class="relative z-10 text-center px-4 md:px-6 max-w-4xl">
    <div class="mb-4 md:mb-6" style="animation: fadeUp 1s 0.2s both">
     <p data-template-id="hero-subtitle" class="canva-text font-hand text-xl md:text-3xl" style="color:var(--midnight);opacity:0.7"></p>
    </div>
    <h1 id="hero-title-el" data-template-id="hero-title" class="canva-text font-display text-5xl md:text-9xl font-bold shimmer leading-tight"></h1>
    <div class="divider-wave w-16 md:w-20 mt-4 md:mt-6 visible" style="animation:ribbonReveal 1s 1.5s both"></div><a href="#story" data-template-id="hero-cta" class="canva-button magnetic-btn inline-block mt-6 md:mt-10 px-10 md:px-14 py-3 md:py-4 rounded-full font-semibold text-base md:text-lg glow-btn glow-ring transition-all hover:scale-110" style="animation:fadeUp 1s 2s both"></a>
   </div>
  </section><!-- DAYS COUNTER -->
  <section class="py-20 px-6 flex items-center justify-center section-fade" style="background:linear-gradient(180deg, var(--cream) 0%, #f9eff4 100%)">
   <div class="text-center w-full">
    <h2 data-template-id="counter-title" class="canva-text font-display text-2xl md:text-5xl font-bold reveal animated-underline"></h2>
    <div class="mt-8 flex items-center justify-center gap-2 md:gap-4 flex-wrap">
     <div class="glass-light rounded-xl md:rounded-2xl p-3 md:p-6 min-w-[80px] md:min-w-[110px] card-hover gradient-border reveal-scale opacity-0" style="animation-delay:0.1s"><span id="counter-days" class="font-display text-3xl md:text-7xl font-bold counter-num" style="color:var(--rose)">0</span>
      <p data-template-id="counter-days-label" class="canva-text font-hand text-sm md:text-xl mt-1 md:mt-2"></p>
     </div>
     <div class="glass-light rounded-xl md:rounded-2xl p-3 md:p-6 min-w-[80px] md:min-w-[110px] card-hover gradient-border reveal-scale opacity-0" style="animation-delay:0.3s"><span id="counter-hours" class="font-display text-3xl md:text-7xl font-bold counter-num" style="color:var(--lavender)">0</span>
      <p data-template-id="counter-hours-label" class="canva-text font-hand text-sm md:text-xl mt-1 md:mt-2"></p>
     </div>
     <div class="glass-light rounded-xl md:rounded-2xl p-3 md:p-6 min-w-[80px] md:min-w-[110px] card-hover gradient-border reveal-scale opacity-0" style="animation-delay:0.5s"><span id="counter-mins" class="font-display text-3xl md:text-7xl font-bold counter-num" style="color:var(--gold)">0</span>
      <p data-template-id="counter-mins-label" class="canva-text font-hand text-sm md:text-xl mt-1 md:mt-2"></p>
     </div>
     <div class="glass-light rounded-xl md:rounded-2xl p-3 md:p-6 min-w-[80px] md:min-w-[110px] card-hover gradient-border reveal-scale opacity-0" style="animation-delay:0.7s"><span id="counter-secs" class="font-display text-3xl md:text-7xl font-bold counter-num" style="color:var(--rose)">0</span>
      <p data-template-id="counter-secs-label" class="canva-text font-hand text-sm md:text-xl mt-1 md:mt-2"></p>
     </div>
    </div>
    <p data-template-id="counter-since" class="canva-text font-hand text-base md:text-xl mt-4 md:mt-6 reveal"></p>
   </div>
  </section><!-- THE DAY WE MET -->
  <section id="story" class="relative py-28 px-6 section-fade" style="background:linear-gradient(180deg, #f9eff4 0%, #ede4f5 100%)">
   <div class="max-w-4xl mx-auto text-center">
    <h2 data-template-id="met-title" class="canva-text font-display text-2xl md:text-6xl font-bold reveal animated-underline"></h2>
    <p data-template-id="met-date" class="canva-text font-hand text-lg md:text-2xl mt-2 md:mt-3 reveal"></p>
    <div class="divider-wave reveal"></div>
    <div class="mt-16 space-y-8 md:space-y-14">
     <div class="glass-light rounded-2xl md:rounded-3xl p-6 md:p-8 max-w-2xl mx-auto card-hover gradient-border reveal-left opacity-0"><img data-template-id="met-img-1" class="canva-image w-full h-80 md:h-[28rem] object-cover rounded-xl md:rounded-2xl shadow-lg img-reveal" loading="lazy">
      <p data-template-id="met-caption-1" class="canva-text font-hand text-lg md:text-xl mt-3 md:mt-5"></p>
     </div>
     <div class="glass-light rounded-2xl md:rounded-3xl p-6 md:p-8 max-w-2xl mx-auto card-hover gradient-border reveal-right opacity-0"><img data-template-id="met-img-2" class="canva-image w-full h-80 md:h-[28rem] object-cover rounded-xl md:rounded-2xl shadow-lg img-reveal" loading="lazy">
      <p data-template-id="met-caption-2" class="canva-text font-hand text-lg md:text-xl mt-3 md:mt-5"></p>
     </div>
    </div>
   </div>
  </section><!-- PARALLAX QUOTE 1 -->
  <section class="parallax-strip w-full relative overflow-hidden section-fade" style="height:calc(55 * min(var(--vh,1vh),1vh));background:#1a0f2e">
   <div class="parallax-img-wrapper">
    <img data-template-id="parallax-img" class="canva-image parallax-img-move w-full h-full object-cover" loading="lazy" style="opacity:0.7">
   </div>
   <div data-template-id="parallax-bg-container" class="absolute inset-0 flex items-center justify-center" style="z-index:10">
    <p data-template-id="parallax-quote" class="canva-text font-display text-3xl md:text-5xl font-bold text-center px-6 reveal" style="text-shadow: 0 4px 30px rgba(0,0,0,0.5)"></p>
   </div>

  <script src="/_sdk/editing_sdk.js"></script>
  <script>
    // Cursor glow
    const glow = document.getElementById('cursor-glow');
    document.addEventListener('mousemove', e => {
      glow.style.left = e.clientX + 'px';
      glow.style.top = e.clientY + 'px';
    });

    // Bokeh overlay
    (function(){
      const container = document.getElementById('bokeh-overlay');
      for(let i = 0; i < 12; i++){
        const dot = document.createElement('div');
        dot.className = 'bokeh-dot';
        const size = 80 + Math.random() * 200;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.top = Math.random() * 100 + '%';
        dot.style.animationDelay = (Math.random() * 8) + 's';
        dot.style.animationDuration = (10 + Math.random() * 8) + 's';
        if(i % 3 === 0) dot.style.background = 'radial-gradient(circle, rgba(196,181,227,0.2) 0%, transparent 70%)';
        if(i % 3 === 2) dot.style.background = 'radial-gradient(circle, rgba(212,165,116,0.15) 0%, transparent 70%)';
        container.appendChild(dot);
      }
    })();

    // Magnetic buttons
    document.querySelectorAll('.magnetic-btn').forEach(btn => {
      const isTouchDevice = () => window.innerWidth <= 768;
      btn.addEventListener('mousemove', e => {
        if(isTouchDevice()) return;
        const rect = btn.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px) scale(1.05)`;
      });
      btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });
    });

    // Petal rain
    (function(){
      const container = document.getElementById('petals');
      const petals = ['🌸','🩷','✿','❀','🪷','💮'];
      const count = window.innerWidth < 768 ? 8 : 22;
      for(let i = 0; i < count; i++){
        const p = document.createElement('span');
        p.className = 'petal';
        p.textContent = petals[Math.floor(Math.random() * petals.length)];
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (10 + Math.random() * 10) + 's';
        p.style.animationDelay = Math.random() * 12 + 's';
        p.style.fontSize = (0.7 + Math.random() * 0.9) + 'rem';
        container.appendChild(p);
      }
    })();

    // Tap to burst hearts
    document.addEventListener('click', e => {
      const hearts = ['💕','💗','💖','🩷','💘','✨'];
      for(let i = 0; i < 5; i++){
        const h = document.createElement('span');
        h.className = 'burst-heart';
        h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = (e.clientX + (Math.random()-0.5)*60) + 'px';
        h.style.top = (e.clientY + (Math.random()-0.5)*40) + 'px';
        h.style.animationDuration = (0.8 + Math.random()*0.5) + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1500);
      }
    });

    // Letter-by-letter hero title
    (function(){
      const el = document.getElementById('hero-title-el');
      const observer = new MutationObserver(() => {
        const text = el.textContent;
        if(!text || el.dataset.animated) return;
        el.dataset.animated = 'true';
        el.innerHTML = '';
        [...text].forEach((ch, i) => {
          const span = document.createElement('span');
          span.className = 'letter-char';
          span.style.animationDelay = (0.8 + i * 0.06) + 's';
          span.textContent = ch === ' ' ? '\u00A0' : ch;
          el.appendChild(span);
        });
      });
      observer.observe(el, {childNodes: true, characterData: true, subtree: true});
    })();

    // Scroll progress + love meter
    window.addEventListener('scroll', () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      const p = h > 0 ? (window.scrollY / h) * 100 : 0;
      document.getElementById('scroll-progress').style.width = p + '%';
      document.getElementById('love-meter-fill').style.height = p + '%';
    });

    // Section fade in
    const sectionObs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('in-view'); });
    }, {threshold: 0.08});
    document.querySelectorAll('.section-fade').forEach(s => sectionObs.observe(s));

    // Starfield
    (function(){
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let stars = [], shootingStars = [];
      function resize(){
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        const starCount = window.innerWidth < 768 ? 80 : 150;
        stars = Array.from({length: starCount}, () => ({
          x: Math.random() * canvas.width, y: Math.random() * canvas.height,
          r: Math.random() * 2.2 + 0.3, speed: Math.random() * 0.5 + 0.1, phase: Math.random() * Math.PI * 2
        }));
      }
      resize(); window.addEventListener('resize', resize);
      setInterval(() => {
        shootingStars.push({
          x: Math.random() * canvas.width * 0.8, y: Math.random() * canvas.height * 0.4,
          len: 60 + Math.random() * 40, speed: 4 + Math.random() * 3,
          angle: Math.PI / 4 + Math.random() * 0.3, life: 1
        });
      }, 3000);
      function draw(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const t = Date.now() * 0.001;
        stars.forEach(s => {
          const alpha = 0.3 + 0.7 * Math.abs(Math.sin(t * s.speed + s.phase));
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${alpha})`; ctx.fill();
        });
        shootingStars = shootingStars.filter(ss => {
          ss.x += Math.cos(ss.angle) * ss.speed;
          ss.y += Math.sin(ss.angle) * ss.speed;
          ss.life -= 0.015;
          if(ss.life <= 0) return false;
          ctx.beginPath();
          ctx.moveTo(ss.x, ss.y);
          ctx.lineTo(ss.x - Math.cos(ss.angle) * ss.len * ss.life, ss.y - Math.sin(ss.angle) * ss.len * ss.life);
          ctx.strokeStyle = `rgba(232,160,180,${ss.life})`;
          ctx.lineWidth = 2; ctx.stroke();
          return true;
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // Scroll reveal
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if(e.isIntersecting){
          e.target.classList.add('visible');
          e.target.querySelectorAll('.img-reveal').forEach(img => img.classList.add('visible'));
          obs.unobserve(e.target);
        }
      });
    }, {threshold: 0.1});
    document.querySelectorAll('.reveal,.reveal-left,.reveal-right,.reveal-envelope,.reveal-scale,.divider-wave,.animated-underline').forEach(el => obs.observe(el));

    // Smooth scroll
    document.querySelector('[data-template-id="hero-cta"]').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('story').scrollIntoView({behavior: 'smooth'});
    });

    // Days counter
    (function(){
      const start = new Date('2026-05-24T00:00:00+05:30');
      let prevD = -1, prevH = -1, prevM = -1, prevS = -1;
      function update(){
        const now = new Date();
        const diff = now - start;
        const days = Math.floor(diff / (1000*60*60*24));
        const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
        const secs = Math.floor((diff % (1000*60)) / 1000);
        const dEl = document.getElementById('counter-days');
        const hEl = document.getElementById('counter-hours');
        const mEl = document.getElementById('counter-mins');
        const sEl = document.getElementById('counter-secs');
        if(days !== prevD){dEl.textContent = days; dEl.classList.remove('count-pop'); void dEl.offsetWidth; dEl.classList.add('count-pop'); prevD = days;}
        if(hours !== prevH){hEl.textContent = hours; hEl.classList.remove('count-pop'); void hEl.offsetWidth; hEl.classList.add('count-pop'); prevH = hours;}
        if(mins !== prevM){mEl.textContent = mins; mEl.classList.remove('count-pop'); void mEl.offsetWidth; mEl.classList.add('count-pop'); prevM = mins;}
        if(secs !== prevS){sEl.textContent = secs; sEl.classList.remove('count-pop'); void sEl.offsetWidth; sEl.classList.add('count-pop'); prevS = secs;}
      }
      update(); setInterval(update, 1000);
    })();

    // Quotes carousel
    (function(){
      const slides = document.querySelectorAll('.quote-slide');
      const dotsContainer = document.getElementById('quote-dots');
      let current = 0;
      slides.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.className = 'w-3 h-3 rounded-full cursor-pointer transition-all duration-300';
        dot.style.background = i === 0 ? 'var(--rose)' : 'var(--lavender)';
        dot.style.transform = i === 0 ? 'scale(1.4)' : 'scale(1)';
        dot.addEventListener('click', () => goTo(i));
        dotsContainer.appendChild(dot);
      });
      function goTo(idx){
        slides[current].classList.add('hidden');
        current = idx;
        slides[current].classList.remove('hidden');
        slides[current].querySelector('.quote-item').classList.add('quote-fade');
        setTimeout(() => slides[current].querySelector('.quote-item').classList.remove('quote-fade'), 600);
        dotsContainer.querySelectorAll('span').forEach((d, i) => {
          d.style.background = i === current ? 'var(--rose)' : 'var(--lavender)';
          d.style.transform = i === current ? 'scale(1.4)' : 'scale(1)';
        });
      }
      setInterval(() => goTo((current + 1) % slides.length), 4000);
    })();

    // 3D tilt on memory cards
    document.querySelectorAll('.tilt-card').forEach(card => {
      const isTouchDevice = () => window.innerWidth <= 768;
      card.addEventListener('mousemove', e => {
        if(isTouchDevice()) return;
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;

    (function(){

      const isTouch = () => window.innerWidth <= 768;
      window.addEventListener('scroll', () => {
        imgs.forEach(img => {
          const strip = img.closest('.parallax-strip');
          if(!strip) return;
          if(isTouch()) {
            img.style.transform = 'translateY(0) scale(1)';
            return;
          }
          const rect = strip.getBoundingClientRect();
          const progress = (window.innerHeight - rect.top) / (window.innerHeight + strip.offsetHeight);
          if(progress >= -0.2 && progress <= 1.2){
            img.style.transform = `translateY(${(progress - 0.5) * 100}px) scale(1.15)`;
